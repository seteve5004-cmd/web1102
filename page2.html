<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트에서 자료 선택하기</title>
</head>
<body>
  <center> 
    주제1. 내가 좋아하는 과일 선택 <br>
    <form>
      <select id='fruits' onchange='drawImage()'>
        <option value='apple.png'> 사과 </option>
         <option value='strawberry.png' selected> 딸기 </option>
         <option value='orange.png'> 오렌지 </option>
      </select>
      <img id = 'fimg' src = 'strawberry.png' alt='설명문' width=100 height=100>
    </form>
    주제2. 오늘 점심 메뉴 선택 <br>
    <form>
      <select id='food' onchange='drawImage()'>
        <option value='apple.png'> 사과 </option>
         <option value='strawberry.png' selected> 딸기 </option>
         <option value='orange.png'> 오렌지 </option>
      </select>
      <img id = 'fimg' src = 'strawberry.png' alt='설명문' width=100 height=100>
    </form>
    
  </center>
    
</body>
</html>
