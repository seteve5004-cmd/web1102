<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트에서 자료 선택하기</title>
    <script>
        function drawImage()
        {
            let sel = document.getElementById('fruits'); //선택리스트 id
            let img = document.getElementById('fimg');  // 이미지를 바꿀이미지 태그 id
            img.src = sel.options[sel.selectedIndex].value; // 선택한 리스트의 위치의 값으로 img 태그의 src 속성을 변경해라

        } 
    </script>

    <script>
         function drawImage1()
        {
            let sel = document.getElementById('food'); //선택리스트 id
            let img = document.getElementById('cimg');  // 이미지를 바꿀이미지 태그 id
            img.src = sel.options[sel.selectedIndex].value; // 선택한 리스트의 위치의 값으로 img 태그의 src 속성을 변경해라
            
        }
    </script>
</head>
<body>
  <center> 
    주제1. 내가 좋아하는 과일 선택 <br>
    <form>
      <select id='fruits' onchange='drawImage()'>
        <option value='appple.png'> 사과 </option>
         <option value='strawberry.png'> 딸기 </option>
         <option value='orange.png'> 오렌지 </option>
      </select>
      <img id = 'fimg' src = 'strawberry.png' alt='설명문' width=100 height=100>
    </form> <br><hr><br>
    주제2. 오늘 점심 메뉴 선택 <br>
    <form>
      <select id='food' onchange='drawImage1()'>
        <option value='pizza.png'> 피자 </option>
         <option value='chicken.png' selected> 치킨 </option>
         <option value='rice.png'> 밥 </option>
          <option value='hamburger.png'> 햄버거 </option>
          <option value='sandwich.png'> 샌드위치 </option>
          
      </select>
      <img id = 'cimg' src = 'chicken.png' alt='설명문' width=100 height=100>
    </form>  <br><hr><br>

      주제3. 20대 버킷리스트 <br>
    <form>
      <select id='list' onchange='drawImage()'>
        <option value='journey.png'>  여행 </option>
         <option value='skydiving.png'> 스카이다이빙 </option>
         <option value='orange.png'>  </option>
      </select>
      <img id = 'limg' src = 'strawberry.png' alt='설명문' width=100 height=100>
    </form> 
    
  </center>
    
</body>
</html>
